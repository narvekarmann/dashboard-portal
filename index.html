<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Power BI Dashboard Portal</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Segoe UI',sans-serif;
    background: linear-gradient(135deg,#0078D4 0%,#00B4D8 100%);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:450px;
}

.card{
    background:white;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 20px 50px rgba(0,0,0,0.2);
}

.header{
    padding:30px;
    text-align:center;
    background:#ffffff;
}

.logo{
    font-size:60px;
    margin-bottom:10px;
}

.title{
    color:#1f2937;
    font-size:28px;
    font-weight:700;
}

.subtitle{
    color:#6b7280;
    margin-top:8px;
    font-size:14px;
}

.content{
    padding:30px;
}

input{
    width:100%;
    padding:15px;
    margin-bottom:15px;
    border:2px solid #e5e7eb;
    border-radius:12px;
    font-size:15px;
    transition:0.3s;
}

input:focus{
    outline:none;
    border-color:#0078D4;
    box-shadow:0 0 0 4px rgba(0,120,212,0.15);
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    background:linear-gradient(135deg,#0078D4,#005ea6);
    color:white;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 25px rgba(0,120,212,0.30);
}

.error{
    text-align:center;
    color:#ef4444;
    margin-top:15px;
    font-weight:600;
}

#dashboardSection{
    display:none;
}

.welcome{
    text-align:center;
    margin-bottom:20px;
    color:#1f2937;
}

.dashboard-link{
    display:block;
    text-decoration:none;
    color:white;
    padding:15px;
    margin-bottom:12px;
    border-radius:12px;
    font-weight:600;
    text-align:center;
    transition:0.3s;
}

.dashboard-link:nth-child(2){
    background:linear-gradient(135deg,#0078D4,#005ea6);
}

.dashboard-link:nth-child(3){
    background:linear-gradient(135deg,#10B981,#059669);
}

.dashboard-link:nth-child(4){
    background:linear-gradient(135deg,#F59E0B,#D97706);
}

.dashboard-link:hover{
    transform:translateY(-3px);
}

.footer{
    text-align:center;
    color:#9ca3af;
    font-size:12px;
    margin-top:15px;
}

</style>
</head>

<body>

<div class="container">

    <div class="card">

        <div class="header">
            <div class="logo">📊</div>
            <div class="title">Dashboard Portal</div>
            <div class="subtitle">
                Secure Access to Power BI Reports
            </div>
        </div>

        <div class="content">

            <!-- LOGIN SECTION -->

            <div id="loginSection">

                <input
                    type="text"
                    id="username"
                    placeholder="Enter Username">

                <input
                    type="password"
                    id="password"
                    placeholder="Enter Password">

                <button onclick="login()">
                    Login
                </button>

                <p id="error" class="error"></p>

            </div>

            <!-- DASHBOARD SECTION -->

            <div id="dashboardSection">

                <div class="welcome">
                    <h2>Available Dashboards</h2>
                    <p>Select a dashboard to open</p>
                </div>

                <a class="dashboard-link"
                   href="https://revupside-my.sharepoint.com/:u:/p/mangesh_n/IQCqtPl9pPDSS7mk1bfqwGQWAeGKlKlezvjgTQ9ieHTiX_E?e=geqqxd"
                   target="_blank">
                    📈 KeprosPT Dashboard
                </a>

                <a class="dashboard-link"
                   href="YOUR_POWERBI_LINK_2"
                   target="_blank">
                    📋 CBSI Dashboard
                </a>

                <a class="dashboard-link"
                   href="YOUR_POWERBI_LINK_3"
                   target="_blank">
                    🎯 Target Dashboard
                </a>

            </div>

            <div class="footer">
                Dashboard Access Portal
            </div>

        </div>

    </div>

</div>

<script>

function login() {

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value;

    const users = {

        "admin":"Admin@123",
        "manager":"Manager@123"

    };

    if(users[username] &&
       users[username] === password){

        document.getElementById("loginSection").style.display = "none";

        document.getElementById("dashboardSection").style.display = "block";

    }
    else{

        document.getElementById("error").innerHTML =
        "❌ Invalid Username or Password";

    }
}

</script>

</body>
</html>
